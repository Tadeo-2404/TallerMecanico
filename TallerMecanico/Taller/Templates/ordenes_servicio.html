<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Taller Mecánico - Servicios de reparación de vehículos">
    <meta name="author" content="Taller Mecánico">
    <title>Taller Mecánico - Reparaciones y Servicios</title>
    
    {% load static %}
    
    <link rel="icon" href="{% static 'img/favicon.ico' %}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body id="page-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="sideNav">
        <a class="navbar-brand js-scroll-trigger" href="#page-top">
            <span class="d-block d-lg-none">Taller Mecánico</span>
            <img class="img-fluid img-profile rounded-circle mx-auto mb-2" 
            src="{% static 'img/logo.gif' %}" 
            alt="Logo Taller Mecánico" />
       
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#about">Sobre Nosotros</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#services">Servicios</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#contact">Contacto</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#vehicles">Vehículos</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#reparaciones">Reparaciones</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <section class="resume-section" id="reparaciones">
            <div class="resume-section-content">
                <h2 class="mb-5">Registrar Reparación</h2>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Vehículo:</label>
                        <select class="form-control" name="vehiculo" required>
                            <option value="">Seleccione un vehículo</option>
                            {% for vehiculo in vehiculos %}
                                <option value="{{ vehiculo.id }}">{{ vehiculo.modelo }} - {{ vehiculo.placa }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pieza:</label>
                        <select class="form-control" name="pieza" required>
                            <option value="">Seleccione una pieza</option>
                            {% for pieza in piezas %}
                                <option value="{{ pieza.id }}">{{ pieza.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de entrada:</label>
                        <input type="date" class="form-control" name="fecha_entrada" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de salida:</label>
                        <input type="date" class="form-control" name="fecha_salida">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Falla:</label>
                        <input type="text" class="form-control" name="falla" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio:</label>
                        <input type="number" class="form-control" name="precio" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </form>
            </div>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
